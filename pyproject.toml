[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-feature-omission-audit"
version = "0.1.0"
description = "An omission audit of post-hoc explainers against known data-generating ground truth: scores each explainer's top-k for the truly-used features it fails to mention, per usage type (main, interaction-only, subgroup-only), swept over planted redundancy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amna Raheeba" }]

[tool.setuptools]
packages = ["omission_audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
